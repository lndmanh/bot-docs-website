<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description"
        content="This legacy page moved to nnsvn.me/botnoname. GitHub Pages is forwarding the request." />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta property="og:title" content="Legacy page moved" />
    <meta property="og:description" content="The old route is being forwarded to the new static website." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nnsvn.me/botnoname/" data-canonical />
    <link rel="canonical" href="https://nnsvn.me/botnoname/" data-canonical />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Page moved</title>
</head>

<body>
    <main class="scene scene-404">
        <div class="orb orb-one" aria-hidden="true"></div>
        <div class="orb orb-two" aria-hidden="true"></div>
        <div class="orb orb-three" aria-hidden="true"></div>

        <section class="panel" aria-labelledby="page-title">
            <p class="eyebrow">Redirecting legacy path</p>
            <h1 id="page-title">This URL now lives somewhere else.</h1>
            <p class="lead">
                The old route is being redirected to the new site with the same path.
            </p>

            <div class="card">
                <div class="card-row">
                    <span class="label">Redirect target</span>
                    <a class="target" href="https://nnsvn.me/botnoname/" data-cta>
                        <span data-target-url>https://nnsvn.me/botnoname/</span>
                    </a>
                </div>

                <p class="supporting-text">
                    Current path: <span data-source-path>/</span>. If you need the destination now, use the button
                    below.
                </p>

                <div class="actions">
                    <a class="button primary" href="https://nnsvn.me/botnoname/" data-cta>
                        Continue to new site
                    </a>
                    <span class="button ghost" aria-hidden="true">404 fallback</span>
                </div>
            </div>
        </section>
    </main>

    <script src="/app.js"></script>
</body>

</html>
